[project]
name = "jobpilot"
version = "0.1.0"
description = "JobPilot, a personal job-hunting agent: crawl job sources, score fit with AI (Codex CLI), prepare and assist applications. Runs locally."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "playwright>=1.47",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "rich>=13.7",
    "tldextract>=5.1",
    "anthropic>=1.0",
]

[project.scripts]
jobpilot = "jobagent.cli:app"
jobagent = "jobagent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/jobagent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
